[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ozzyyaml"
version = "0.3.0"
description = "YAML 1.2.2 parser and emitter with Unicode anchor support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Peter Murphy", email = "peterkmurphy@gmail.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Text Processing :: Markup",
]
urls = { Homepage = "https://github.com/peterkmurphy/ozzyyaml", Repository = "https://github.com/peterkmurphy/ozzyyaml", Issues = "https://github.com/peterkmurphy/ozzyyaml/issues" }

[tool.maturin]
manifest-path = "../crates/ozzyyaml-python/Cargo.toml"
module-name = "ozzyyaml._native"
python-source = "."
