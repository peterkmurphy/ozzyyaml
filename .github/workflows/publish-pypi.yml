# Build wheels for Linux / macOS / Windows and publish to PyPI on version tags.
#
# Auth: Trusted Publishing (OIDC) — no PYPI_API_TOKEN secret.
# Configure once on PyPI (see docs/releasing.md), then:
#
#   git tag v0.2.0 && git push origin v0.2.0

name: publish-pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# Per-interpreter wheels (not abi3). Explicit list avoids --find-interpreter
# picking unexpected runtimes on manylinux images.
env:
  MATURIN_INTERPRETERS: "3.10 3.11 3.12 3.13 3.14"

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          working-directory: python
          args: --release --out dist --interpreter ${{ env.MATURIN_INTERPRETERS }}
      - name: Smoke-test (x86_64)
        if: matrix.target == 'x86_64'
        working-directory: python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pytest
          pip install --no-index --find-links dist ozzyyaml
          pytest tests -q
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: python/dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          working-directory: python
          args: --release --out dist --interpreter python
      - name: Smoke-test
        working-directory: python
        shell: bash
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          pip install pytest
          pip install --no-index --find-links dist ozzyyaml
          pytest tests -q
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-cp${{ matrix.python }}
          path: python/dist

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: python
          args: --release --out dist --interpreter ${{ env.MATURIN_INTERPRETERS }}
      - name: Smoke-test (aarch64 only)
        if: matrix.target == 'aarch64-apple-darwin'
        working-directory: python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pytest
          pip install --no-index --find-links dist ozzyyaml
          pytest tests -q
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: python/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: python
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: python/dist

  release:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    # Tags auto-publish; workflow_dispatch can retry a failed release build.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [linux, windows, macos, sdist]
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
