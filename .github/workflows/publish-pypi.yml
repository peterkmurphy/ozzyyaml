# Build wheels for Linux / macOS / Windows and publish to PyPI on version tags.
#
# Setup (once):
#   1. Create a PyPI API token with upload rights for project `ozzyyaml`
#   2. Add it as a GitHub Actions secret named `PYPI_API_TOKEN`
#
# Release:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Or run this workflow manually via workflow_dispatch (builds artifacts;
# upload still requires a tag).

name: publish-pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# PyO3 0.23 supports through 3.13. Do not use --find-interpreter: manylinux
# images now ship 3.14 and the build fails.
env:
  MATURIN_INTERPRETERS: "3.10 3.11 3.12 3.13"

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          working-directory: python
          args: --release --out dist --interpreter ${{ env.MATURIN_INTERPRETERS }}
      - name: Smoke-test (x86_64)
        if: matrix.target == 'x86_64'
        working-directory: python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pytest
          pip install --no-index --find-links dist ozzyyaml
          pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: python/dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          working-directory: python
          args: --release --out dist --interpreter python
      - name: Smoke-test
        working-directory: python
        shell: bash
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          pip install pytest
          pip install --no-index --find-links dist ozzyyaml
          pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-cp${{ matrix.python }}
          path: python/dist

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: python
          args: --release --out dist --interpreter ${{ env.MATURIN_INTERPRETERS }}
      - name: Smoke-test
        working-directory: python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pytest
          pip install --no-index --find-links dist ozzyyaml
          pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: python/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: python
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: python/dist

  release:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos, sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
