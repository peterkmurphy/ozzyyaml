# Build wheels for Linux / macOS / Windows and publish to PyPI on version tags.
#
# Auth: Trusted Publishing (OIDC) — no PYPI_API_TOKEN secret.
# Configure once on PyPI (see docs/releasing.md), then:
#
#   git tag v0.2.0 && git push origin v0.2.0

name: publish-pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# PyO3 0.23 supports through 3.13. Do not use --find-interpreter: manylinux
# images now ship 3.14 and the build fails.
env:
  MATURIN_INTERPRETERS: "3.10 3.11 3.12 3.13"

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          working-directory: python
          args: --release --out dist --interpreter ${{ env.MATURIN_INTERPRETERS }}
      - name: Smoke-test (x86_64)
        if: matrix.target == 'x86_64'
        working-directory: python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pytest
          pip install --no-index --find-links dist ozzyyaml
          pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: python/dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          working-directory: python
          args: --release --out dist --interpreter python
      - name: Smoke-test
        working-directory: python
        shell: bash
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          pip install pytest
          pip install --no-index --find-links dist ozzyyaml
          pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-cp${{ matrix.python }}
          path: python/dist

  macos:
    # macos-13 (Intel) queues for hours on GitHub-hosted runners; ship
    # Apple Silicon wheels for 0.1.x. Add x86_64 later if demand appears.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          working-directory: python
          args: --release --out dist --interpreter ${{ env.MATURIN_INTERPRETERS }}
      - name: Smoke-test
        working-directory: python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pytest
          pip install --no-index --find-links dist ozzyyaml
          pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: python/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: python
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: python/dist

  release:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos, sdist]
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
