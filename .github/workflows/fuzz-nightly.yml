# Longer scheduled fuzz runs. Failures upload artifacts for triage.
name: fuzz-nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_parse_str, fuzz_roundtrip]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }} (~15 min)
        run: |
          extra=()
          if [[ "${{ matrix.target }}" == "fuzz_roundtrip" ]]; then
            # Rc cycles in Value graphs are intentional; suppress LSan only.
            extra+=(-detect_leaks=0)
          fi
          cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time=900 "${extra[@]}"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts
            fuzz/corpus/${{ matrix.target }}
          if-no-files-found: ignore
