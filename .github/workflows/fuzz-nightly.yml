# Longer scheduled fuzz runs. Failures upload artifacts and open a triage issue.
name: fuzz-nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_parse_str, fuzz_roundtrip]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run ${{ matrix.target }} (~15 min)
        id: fuzz
        env:
          # Exit-time LSan still fires after max_total_time without this; see ci.yml.
          ASAN_OPTIONS: detect_leaks=0
        run: |
          extra=()
          if [[ "${{ matrix.target }}" == "fuzz_roundtrip" ]]; then
            # Rc cycles in Value graphs are intentional; suppress LSan only.
            extra+=(-detect_leaks=0)
          fi
          cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time=900 "${extra[@]}"
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts
            fuzz/corpus/${{ matrix.target }}
          if-no-files-found: ignore
      - name: Open triage issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="fuzz-nightly crash: ${{ matrix.target }} ($(date -u +%Y-%m-%d))"
          body=$(cat <<EOF
          Automated triage from [\`${{ github.workflow }}\` run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          - Target: \`${{ matrix.target }}\`
          - Artifact: \`fuzz-artifacts-${{ matrix.target }}\` (if uploaded)

          Reproduce locally with the artifact corpus/crash inputs under \`fuzz/artifacts/\`, then triage in \`docs/superpowers/fuzz-findings.md\`.
          EOF
          )
          gh issue create --title "$title" --body "$body" || echo "issue create failed (non-fatal)"
