name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: Conformance summary
        run: |
          cargo test -p ozzyyaml-parser --test yaml_test_suite -- --nocapture
          cargo test -p ozzyyaml-parser --test yaml_test_suite_errors -- --nocapture
          echo "Conformance: 255/255 valid events + 78/78 invalid rejections (see docs/conformance.md)"

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Maturin and pytest
        run: pip install maturin pytest
      - name: Build wheel
        run: maturin build --release --out dist
      - name: Install wheel and run tests
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install dist/*.whl pytest
          # Leave python/ so the source package does not shadow the wheel.
          cd "$RUNNER_TEMP"
          pytest "$GITHUB_WORKSPACE/python/tests" -q

  python-314t:
    name: python 3.14t smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
      - name: Confirm free-threaded interpreter
        run: |
          python --version --version
          python -c "import sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1"
      - name: Install Maturin
        run: pip install "maturin>=1.8"
      - name: Build free-threaded wheel
        # Prefer build+venv over `maturin develop`: runner Pythons are often
        # PEP 668-managed, and develop installs into the active env.
        run: |
          maturin build --release --out dist --interpreter python
          ls -la dist
          # Must be a cp314t wheel; a plain cp314 wheel will not install on 3.14t.
          ls dist/*cp314t*.whl
      - name: Install wheel into venv
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install dist/*cp314t*.whl
      - name: Smoke import on free-threaded interpreter
        # Import from outside python/: cwd would otherwise shadow the wheel with
        # the source tree (no _native extension module).
        working-directory: ${{ runner.temp }}
        run: |
          . "$GITHUB_WORKSPACE/python/.venv/bin/activate"
          python -c "import sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1"
          python -c "import ozzyyaml; print('installed', ozzyyaml.__version__)"
          # Module opts into gil_used=true (Rc Value graphs). Import may
          # re-enable the GIL with a RuntimeWarning — that is expected.
          python -W default -c "import sys; import ozzyyaml; print('gil_enabled', sys._is_gil_enabled()); print(ozzyyaml.load('1\n'))"

  fuzz:
    name: fuzz (bounded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz_parse_str (~90s)
        run: cargo +nightly fuzz run fuzz_parse_str -- -max_total_time=90
      - name: fuzz_roundtrip (~90s)
        # Value graphs can contain Rc cycles (YAML aliases); LSan reports those
        # as leaks by design. Still catch ASan memory errors.
        run: cargo +nightly fuzz run fuzz_roundtrip -- -max_total_time=90 -detect_leaks=0
