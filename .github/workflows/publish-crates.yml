# Publish Rust crates to crates.io on version tags via Trusted Publishing (OIDC).
#
# Configure once on crates.io for each crate (see docs/releasing.md), then bump
# versions and push a matching tag:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# workflow_dispatch can finish a partial publish (e.g. after a mid-chain failure).

name: publish-crates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          already_published() {
            local pkg="$1"
            local ver
            ver="$(cargo metadata --no-deps --format-version 1 \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(p['version'] for p in d['packages'] if p['name']=='${pkg}'))")"
            curl -fsS -A 'ozzyyaml-publish' \
              "https://crates.io/api/v1/crates/${pkg}/${ver}" >/dev/null 2>&1
          }
          publish_with_retry() {
            local pkg="$1"
            if already_published "${pkg}"; then
              echo "${pkg} already on crates.io — skipping"
              return 0
            fi
            local attempt
            for attempt in 1 2 3 4 5 6 7 8; do
              echo "::group::cargo publish -p ${pkg} (attempt ${attempt})"
              if cargo publish -p "${pkg}"; then
                echo "::endgroup::"
                return 0
              fi
              echo "::endgroup::"
              echo "Publish of ${pkg} failed; waiting for crates.io index…"
              sleep 20
            done
            echo "Giving up on ${pkg}"
            return 1
          }
          # No cycle: ozzyyaml must not depend on ozzyyaml-emit (even as a
          # versioned path/dev-dep) or packaging blocks on an unpublished emit.
          publish_with_retry ozzyyaml-parser
          publish_with_retry ozzyyaml
          publish_with_retry ozzyyaml-emit
