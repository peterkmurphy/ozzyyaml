[package]
name = "ozzyyaml"
description = "YAML 1.2.2 Core-schema documents with shared aliases and cycles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ozzyyaml"
keywords = ["yaml", "compose", "core-schema", "anchors"]
categories = ["parser-implementations", "encoding", "data-structures"]

[dependencies]
ozzyyaml-parser = { version = "0.1.0", path = "../ozzyyaml-parser" }
thiserror = "2"

[dev-dependencies]
ozzyyaml-emit = { version = "0.1.0", path = "../ozzyyaml-emit" }
